name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Stage 1: Установка и сборка зависимостей
  setup:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'  # кэширует node_modules для ускорения

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build (optional)
        run: npm run build

      # Сохраняем node_modules для следующего этапа
      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: |
            node_modules
            dist  # если есть папка сборки
            package-lock.json
          retention-days: 1

  # Stage 2: Установка браузеров Playwright
  install-browsers:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: setup  # ждем завершения setup
    steps:
      - uses: actions/checkout@v4

      # Восстанавливаем node_modules
      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: .

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Сохраняем браузеры для следующего этапа
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-browsers
          path: ~/.cache/ms-playwright
          retention-days: 1

  # Stage 3: Запуск тестов (параллельно или последовательно)
  tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: install-browsers  # ждем установки браузеров
    strategy:
      matrix:
        shard: [1, 2, 3]  # разделение тестов на 3 части для параллельного выполнения
    steps:
      - uses: actions/checkout@v4

      # Восстанавливаем node_modules
      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: .

      # Восстанавливаем браузеры
      - uses: actions/download-artifact@v4
        with:
          name: playwright-browsers
          path: ~/.cache/ms-playwright

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # Stage 4: Сборка общего отчета (опционально)
  report:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - uses: actions/checkout@v4

      # Собираем отчеты со всех шардов
      - uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: all-reports/

      - name: Merge reports
        run: npx playwright merge-reports --reporter=html ./all-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-final-report
          path: playwright-report/
          retention-days: 30