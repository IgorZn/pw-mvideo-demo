name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==================== BUILD JOB ====================
  build:
    name: 📦 Build & Install Dependencies
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upload entire workspace (including node_modules)
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            node_modules
            package-lock.json
            playwright.config.ts
            tsconfig.json
            src/
            tests/
          retention-days: 1

  # ==================== SETUP BROWSERS JOB ====================
  setup-browsers:
    name: 🌐 Install Playwright Browsers
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .

      - name: Debug - Check if Playwright is installed
        run: |
          ls -la node_modules/.bin/ | grep playwright || echo "Playwright not found in .bin"
          npx playwright --version || echo "Playwright command failed"

      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

      - name: Upload browsers artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browsers
          path: ~/.cache/ms-playwright
          retention-days: 1

  # ==================== UI TESTS JOB ====================
  test-ui:
    name: 🧪 Run UI Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: setup-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .

      - name: Download browsers
        uses: actions/download-artifact@v4
        with:
          name: playwright-browsers
          path: ~/.cache/ms-playwright

      - name: Set PLAYWRIGHT_BROWSERS_PATH
        run: echo "PLAYWRIGHT_BROWSERS_PATH=~/.cache/ms-playwright" >> $GITHUB_ENV

      - name: Run UI tests
        run: npx playwright test --project=ui

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: playwright-report/
          retention-days: 30

  # ==================== API TESTS JOB ====================
  test-api:
    name: 🔌 Run API Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .

      - name: Run API tests
        run: npx playwright test --project=api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: playwright-report/
          retention-days: 30

  # ==================== REPORT JOB ====================
  report:
    name: 📊 Generate & Upload Final Report
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [test-ui, test-api]
    if: always()
    steps:
      - name: Download UI test results
        uses: actions/download-artifact@v4
        with:
          name: ui-test-results
          path: reports/ui/

      - name: Download API test results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: reports/api/

      - name: Merge and upload final report
        run: |
          mkdir -p final-report
          cp -r reports/ui/* final-report/ 2>/dev/null || true
          cp -r reports/api/* final-report/ 2>/dev/null || true
          echo "Final report ready"

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-final-report
          path: final-report/
          retention-days: 30